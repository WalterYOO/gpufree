[package]
name = "gpufree"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Check GPU availability across SSH hosts: JSON for scripts, a searchable TUI for humans"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.cargo]
# 骨架阶段依赖尚未接入；M1 完成后删除本节。
unused_dependencies = "allow"

[profile.release]
lto = "thin"
strip = true
